name: PHP Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: PHP version to release, for example 8.4.3
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: php-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release PHP ${{ github.event.inputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: ./scripts/release-php.sh
